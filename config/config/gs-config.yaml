# 心跳频率, 单位秒
# 0 为关闭心跳
heartbeatInterval: 5

# 是否忽略云崽配置文件的仅艾特
ignoreOnlyReplyAt: false

# gsuid_core上报前缀（按bot账号单独配置）
# 键为bot账号(self_id)，值为要拼接在消息最前面的前缀
#   - prefix: 前缀内容
#   - skipIfHasPrefix: 有前缀不插入（默认 true）
#     当命令去掉开头空白和/后，首字符是大小写字母或数字时，视为"已有前缀"
#   - noPrefixCommands: 不加前缀命令
#     判断方式：去掉开头空白和/后，命令以配置项任一内容开头即命中
gsuidBotPrefix: {}

# 是否单独添加仅艾特或前缀
# 可以为每个连接单独添加
onlyReplyAt:
  enable: false
  prefix:
    - 示例前缀1

# 连接服务列表
# name: 连接名字  请保证每个名字都不相同,否则会出问题
# address: 连接地址
# reconnectInterval: 重连间隔 单位:秒
# maxReconnectAttempts: 最大连接次数 0 为无限制
# accessToken: 鉴权token
servers:
  - name: 卡提希娅
    address: ws://127.0.0.1:8765/ws/yunzai
    reconnectInterval: 5
    maxReconnectAttempts: 0

# 消息存储时间 (秒)
# 0 为不存储
msgStoreTime: 300

# 掉线时否通知主人
disconnectToMaster: false

# 重连成功时是否通知主人
reconnectToMaster: false

# 首次连接成功时是否通知主人
firstconnectToMaster: false

# 通知主人方式
# 0: 通知所有主人
# 大于0: 通知指定顺序的主人
howToMaster: 0

# 禁用群聊列表
noGroup: []

# 白名单群聊
yesGroup: []

# 禁言拦截
muteStop: false

# 临时会话是否上报
tempMsgReport: false

# 不转发消息前缀
noMsgStart: []

# 不包含消息内容
noMsgInclude: []

# 数据库同步锁
taskQueue: 0
